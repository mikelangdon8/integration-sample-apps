name: "IIS runner test"

permissions:
  contents: read

on:
  push:
    branches:
      - test/iis-runner
  workflow_dispatch:

jobs:
  test-iis-on-runner:
    name: Test IIS on the Windows runner
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install IIS, run Alloy and check the IIS metrics
        shell: powershell
        run: .\iis-runner-test\run.ps1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iis-runner-test-output
          path: iis-runner-test-output
